<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="description" content="NVIDIA AI 멀티에이전트가 찾아주는 맞춤형 복지 혜택 플랫폼">
  <meta name="theme-color" content="#3B82F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="복지ON">
  <meta property="og:title" content="복지ON - AI 맞춤 복지 혜택">
  <meta property="og:description" content="NVIDIA AI가 찾아주는 나만의 복지 혜택">
  <meta property="og:type" content="website">
  <title>복지ON - AI 맞춤형 복지 플랫폼</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ─── 로딩 화면 ──────────────────────────────────────────────────── -->
<div id="loading-screen">
  <div class="ld-logo">🏛️</div>
  <div class="ld-title">복지ON</div>
  <div class="ld-sub">맞춤 복지 혜택 분석 중...</div>
  <div class="spinner"></div>
</div>

<!-- ─── 온보딩 ─────────────────────────────────────────────────────── -->
<div id="onboarding-page">
  <div class="onboarding-wrap">
    <div class="onboarding-hero">
      <div class="ob-logo">🏛️</div>
      <div class="ob-title">복지ON</div>
      <div class="ob-sub">NVIDIA AI 멀티에이전트가<br>나에게 맞는 복지 혜택을 찾아드립니다</div>
    </div>
    <div class="ob-features">
      <div class="ob-feature"><div class="ob-feature-icon">📣</div><div class="ob-feature-label">AI 마을방송</div></div>
      <div class="ob-feature"><div class="ob-feature-icon">🎤</div><div class="ob-feature-label">음성 상담</div></div>
      <div class="ob-feature"><div class="ob-feature-icon">🎯</div><div class="ob-feature-label">맞춤 혜택</div></div>
      <div class="ob-feature"><div class="ob-feature-icon">📞</div><div class="ob-feature-label">전화 발송</div></div>
    </div>
    <button class="btn-start" onclick="startApp()">시작하기 →</button>
    <div style="margin-top:12px;font-size:.78rem;color:var(--text-dim);text-align:center">개인정보는 기기에만 저장됩니다</div>
  </div>
</div>

<!-- ─── 메인 앱 ─────────────────────────────────────────────────────── -->
<div id="app">

  <!-- ▌사이드바 (데스크탑 전용) ──────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🏛️</div>
        <div class="sidebar-logo-text">복지ON</div>
      </div>
      <div class="sidebar-user" id="sidebar-user" onclick="navigateTo('profile')">
        <div class="avatar" style="width:36px;height:36px;background:var(--bg3);font-size:1rem;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">프로필 설정</div>
          <div class="sidebar-user-sub">클릭하여 입력</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">메인</div>
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">🏠</span><span>대시보드</span>
        </button>
        <button class="nav-item" data-page="profile">
          <span class="nav-icon">👤</span><span>내 정보</span>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">AI 혜택</div>
        <button class="nav-item" data-page="benefits">
          <span class="nav-icon">🎁</span><span>맞춤 혜택</span>
        </button>
        <button class="nav-item" data-page="chat">
          <span class="nav-icon">💬</span><span>AI 상담</span>
        </button>
        <button class="nav-item" data-page="voice">
          <span class="nav-icon">📣</span><span>AI 마을방송</span>
        </button>
        <button class="nav-item" data-page="lifecycle">
          <span class="nav-icon">🔮</span><span>생애 계획</span>
        </button>
        <button class="nav-item" data-page="news">
          <span class="nav-icon">📰</span><span>복지 뉴스</span>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">도구</div>
        <button class="nav-item" data-page="apply">
          <span class="nav-icon">📋</span><span>신청 가이드</span>
        </button>
        <button class="nav-item" data-page="admin">
          <span class="nav-icon">🏛️</span><span>사각지대 발굴</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span><span>설정</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="welfare-score-mini">
        <div class="wsm-label">복지 점수</div>
        <div class="wsm-score" id="wsm-score">--점</div>
        <div class="wsm-sub" id="wsm-sub">프로필 입력 필요</div>
      </div>
    </div>
  </aside>

  <!-- ▌메인 래퍼 ──────────────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- 앱 헤더 (모바일: 로고+타이틀+우측버튼 / 데스크탑: 타이틀+버튼) -->
    <header class="app-header">
      <!-- 모바일: 로고 -->
      <div class="app-header-logo" onclick="navigateTo('home')">🏛️ 복지ON</div>
      <!-- 현재 페이지 타이틀 -->
      <div class="header-title" id="header-title">대시보드</div>
      <!-- 우측 버튼 -->
      <div class="header-right">
        <button class="btn-icon" onclick="toggleTheme()" title="테마">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="btn-icon" onclick="navigateTo('settings')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ▌앱 바디 (스크롤 영역) ──────────────────────────────────── -->
    <div class="app-body">

      <!-- 페이지들 -->
      <div class="page active" id="page-home"></div>
      <div class="page" id="page-profile"></div>
      <div class="page" id="page-benefits"></div>
      <div class="page" id="page-news"></div>
      <div class="page" id="page-lifecycle"></div>
      <div class="page" id="page-apply"></div>
      <div class="page" id="page-settings"></div>
      <div class="page" id="page-chat"></div>
      <div class="page" id="page-voice"></div>
      <div class="page" id="page-admin"></div>

    </div><!-- /app-body -->

  </div><!-- /main-wrapper -->

  <!-- ▌바텀 네비게이션 (모바일) ──────────────────────────────────── -->
  <nav class="bottom-nav" id="bottom-nav">

    <!-- 홈 -->
    <button class="bottom-nav-item active" data-nav="home">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span>홈</span>
    </button>

    <!-- 혜택 -->
    <button class="bottom-nav-item" data-nav="benefits">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12"/>
          <rect x="2" y="7" width="20" height="5"/>
          <line x1="12" y1="22" x2="12" y2="7"/>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
      </div>
      <span>혜택</span>
    </button>

    <!-- AI 상담 FAB -->
    <button class="bottom-nav-item nav-fab" id="nav-fab-btn" data-nav="chat" onclick="navigateTo('chat')">
      <div class="nav-fab-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <circle cx="9" cy="10" r="1" fill="white" stroke="none"/>
          <circle cx="12" cy="10" r="1" fill="white" stroke="none"/>
          <circle cx="15" cy="10" r="1" fill="white" stroke="none"/>
        </svg>
      </div>
      <span>AI상담</span>
    </button>

    <!-- AI 마을방송 -->
    <button class="bottom-nav-item" data-nav="voice">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
      </div>
      <span>마을방송</span>
    </button>

    <!-- 사각지대 발굴 -->
    <button class="bottom-nav-item" data-nav="admin">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <span>발굴</span>
    </button>

  </nav><!-- /bottom-nav -->

</div><!-- /app -->

<!-- ─── 토스트 ──────────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ─── 혜택 상세 모달 ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="benefit-modal-overlay" onclick="closeAllModals()"></div>
<div class="modal" id="benefit-detail-modal">
  <div class="modal-handle"></div>
  <div id="benefit-detail-content"></div>
</div>

<!-- ─── 뉴스 상세 모달 ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="news-modal-overlay" onclick="closeAllModals()"></div>
<div class="modal" id="news-detail-modal">
  <div class="modal-handle"></div>
  <div id="news-detail-content"></div>
</div>

<!-- ─── 스크립트 ─────────────────────────────────────────────────────── -->
<script src="constants.js"></script>
<script src="ui.js"></script>
<script src="db.js"></script>
<script src="agents.js"></script>
<script src="profile.js"></script>
<script src="benefits.js"></script>
<script src="news.js"></script>
<script src="lifecycle.js"></script>
<script src="apply.js"></script>
<script src="chat.js"></script>
<script src="voice.js"></script>
<script src="admin.js"></script>
<script src="core.js"></script>

<script>
  // ESC 닫기
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllModals();
  });

  // PWA 설치 배너
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => toast('📲 복지ON을 홈 화면에 추가하세요!', 'info', 5000), 4000);
  });
</script>
</body>
</html>
